---

name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  perl_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl-version:
          - '5.38'
          - latest
    steps:
      - uses: actions/checkout@v5
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
      - name: perl version
        run: perl -V
      - name: Install minilla
        run: cpanm -n Minilla
      - name: minil test
        run: minil test
