---

name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  perl_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl-version:
          - '5.14'
          - latest
    container:
      image: perl:${{ matrix.perl-version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: perl version
        run: perl -V
      - name: Install minilla
        run: cpanm -n Minilla
      - name: minil test
        run: minil test
